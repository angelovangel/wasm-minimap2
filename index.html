<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Align reads to reference</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://omnipotent.net/jquery.sparkline/2.1.2/jquery.sparkline.min.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">minimap2 in the browser</h2>
        <div class="row" id="inputs">
            <div class="col-md-4 file-input">
                <label for="ref" class="form-label fw-bold">1. Reference (.fasta/.fa)</label>
                <input type="file" id="ref" class="form-control" accept=".fasta,.fa">
            </div>

            <div class="col-md-4 file-input">
                <label for="query" class="form-label fw-bold">2. Query Reads (.fastq/.fq)</label>
                <input type="file" id="query" class="form-control" multiple accept=".fastq,.gz">
            </div>

            <div class="col-md-2 file-input">
                <label for="subsample" class="form-label fw-bold">3. Use reads</label>
                <div class="input-group" title="Randomly subsample each fastq (seqtk, fixed seed). 100% = use all reads.">
                    <input type="number" id="subsample" class="form-control" value="100" min="0.1" max="100" step="any">
                    <span class="input-group-text">%</span>
                </div>
            </div>

            <div class="col-md-2 file-input">
                <label for="preset" class="form-label fw-bold">4. Preset</label>
                <select id="preset" class="form-select" title="minimap2 -x preset">
                    <option value="map-ont" selected>map-ont (Nanopore)</option>
                    <option value="map-hifi">map-hifi (PacBio HiFi)</option>
                    <option value="map-pb">map-pb (PacBio CLR)</option>
                    <option value="sr">sr (short reads)</option>
                    <option value="asm5">asm5 (assembly, ~0.1% div.)</option>
                    <option value="asm20">asm20 (assembly, ~5% div.)</option>
                    <option value="splice">splice (spliced RNA)</option>
                </select>
            </div>
        </div>
        
        <div class="action-buttons">
            <button id="btn" class="btn btn-primary btn me-2">
                <i class="fas fa-play"></i> Run
            </button>
            <button id="reset-btn" class="btn btn-secondary btn me-3">
                <i class="fas fa-redo"></i> RESET
            </button>
        </div>
        
        <div id="output">
            <p id="initial-message" class="text-muted">
                Upload your files and click 'Run Analysis', no data leaves the browser.
                The reference can have multiple entries. Each selected fastq file is treated as a separate sample.
            </p>
        </div>
        
        <!-- Filled by script.js: combined summary, sample tabs, one panel per sample -->
        <div id="results"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://biowasm.com/cdn/v3/aioli.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
